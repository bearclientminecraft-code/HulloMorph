name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # SDK (platforms/build-tools + принятые лицензии) уже предустановлен в ubuntu-latest;
      # android-actions/setup-android@v3 падает на текущих раннерах, поэтому шаг убран.
      - name: Android SDK info
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ChadMorph-debug-apk
          path: app/build/outputs/apk/debug/*.apk
